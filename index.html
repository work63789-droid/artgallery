<style>
:root{--fg:#f4efe6;--bg:#0f0e0d;--glass:rgba(18,16,14,.45)}

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,14,13,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;padding:24px;transition:opacity .6s}
#ov h1{font-weight:400;font-size:clamp(26px,5vw,44px);margin:0 0 10px;letter-spacing:.04em}
#ov p{margin:6px 0;opacity:.8;font-size:14px;font-family:system-ui,sans-serif}
#bar{width:220px;height:2px;background:rgba(255,255,255,.15);margin:22px auto 0;overflow:hidden;border-radius:2px}
#bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .25s}
#ov b{display:inline-block;margin-top:18px;padding:11px 28px;border:1px solid var(--fg);border-radius:30px;font-weight:400;letter-spacing:.12em;font-size:13px;font-family:system-ui,sans-serif;opacity:.25;transition:opacity .4s}
#ov.ready{cursor:pointer}#ov.ready b{opacity:1}#ov.ready #bar{opacity:0}
#msg{max-width:460px;margin:14px auto 0;color:#f2b8a0;font-size:13px;font-family:system-ui,sans-serif;line-height:1.5}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}canvas{touch-action:none}
button,select,input{font:inherit;color:inherit}
#mb{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:44px;height:44px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:6;display:grid;place-items:center;cursor:pointer;padding:0}
#mb svg{width:20px;height:20px;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round}
#menu{position:fixed;top:calc(64px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 90px);overflow:auto;box-sizing:border-box;padding:14px 18px 18px;background:rgba(22,20,18,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:14px;z-index:7;font-family:system-ui,sans-serif;font-size:14px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#menu[hidden]{display:none}

#menu .mh button{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.08);cursor:pointer}
#menu h4{margin:14px 0 7px;font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
#menu .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.06);padding:3px;border-radius:9px}
#menu .seg button{border:0;background:none;padding:9px 0;border-radius:7px;cursor:pointer;opacity:.75}
#menu .seg button.on{background:var(--fg);color:#141210;opacity:1}
#menu small{display:block;margin-top:6px;opacity:.55;font-size:12px;line-height:1.4}
#menu input[type=range]{width:100%;accent-color:var(--fg)}
#menu .tg{display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:12px}#menu .tg input{width:18px;height:18px;accent-color:var(--fg)}
#menu .row{display:flex;gap:8px}#menu .row>*{flex:1;min-width:0}
#menu .btn,#menu select{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:9px;padding:10px 12px;cursor:pointer;text-align:center}

#menu p{margin:14px 0 0;opacity:.6;font-size:12.5px;line-height:1.5}
#joy{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(20,18,16,.18);pointer-events:none;display:none;z-index:4;transition:opacity .25s}

@media (max-width:700px),(max-height:500px){
 #menu{top:auto;bottom:0;left:0;right:0;width:auto;max-height:78dvh;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}

 #ov p{font-size:13px}
}

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ===== EDIT ME: artworks. src = image path, w = printed width in metres, frame = 'black' | 'oak' | 'white'
   optional: note = third line on the wall label (medium, year), mat = mat border in metres, lux = spotlight strength (default 20) ===== */
const ARTWORKS=[
 {src:'art/nocturne.jpg',title:'Untitled (Nocturne)',artist:'Saba',w:2.2,frame:'black'},
 {src:'art/thresholds.jpg',title:'Thresholds',artist:'Saba',w:1.7,frame:'oak'},
 {src:'art/rehal.jpg',title:'Rehal',artist:'Saba',w:1.05,frame:'black'}];

const HANG=[{x:7.35,z:-5.5,f:1},{x:2.35,z:0,f:1},{x:5.9,z:6,f:-1}];

const H=3.4,W=10,D=6,UX=4.7,UZ=-5.5,SILL=.42,HEAD=3.0,GX=W+.2,EYE=1.62;
const $=s=>document.querySelector(s),ov=$('#ov'),cap=$('#cap'),msg=$('#msg'),bar=$('#bar i');
/* ---------- device & quality: phones get lighter effects, desktops get everything ---------- */
const TOUCH=matchMedia('(pointer: coarse)').matches,PHONE=TOUCH&&Math.min(screen.width,screen.height)<600;
const TIERS={low:{pr:1.25,msaa:0,bloom:false,focus:false,spotShadow:false,sun:1024},medium:{pr:1.5,msaa:4,bloom:true,focus:true,spotShadow:false,sun:2048},high:{pr:1.5,msaa:4,bloom:true,focus:true,spotShadow:true,sun:2048}};

let qSel=store.get('quality','auto'),sens=store.get('sens',1),tier=qSel==='auto'?autoTier():qSel,Q=TIERS[tier]||TIERS.high;
if(location.protocol==='file:')msg.textContent='This page loads textures and 3D models, which browsers block when a file is opened directly. Serve the folder instead, e.g. run "python -m http.server" here and open http://localhost:8000, or use VS Code Live Server.';

const cam=new THREE.PerspectiveCamera(58,1,.05,500);cam.rotation.order='YXZ';
const pmrem=new THREE.PMREMGenerator(renderer);

/* ---------- loading ---------- */
const LM=new THREE.LoadingManager(),errs=[];
LM.onProgress=(u,l,t)=>bar.style.width=(100*l/t)+'%';LM.onError=u=>errs.push(u);
const TL=new THREE.TextureLoader(LM),GL=new GLTFLoader(LM),HL=new RGBELoader(LM),pending=[];
const tx=(url,size,srgb)=>{const t=TL.load('assets/tex/'+url);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=ANI;t.repeat.set(1/size,1/size);if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t};

/* ---------- box-projected reflections: glossy surfaces reflect the room in the right place ---------- */
const BP={pos:{value:new THREE.Vector3(W/2,H/2,(UZ+D)/2)},size:{value:new THREE.Vector3(W,H,D-UZ)}};
const BP_CHUNK=THREE.ShaderChunk.envmap_physical_pars_fragment.replaceAll('reflectVec = inverseTransformDirection( reflectVec, viewMatrix );','reflectVec = inverseTransformDirection( reflectVec, viewMatrix );\n\t\t\treflectVec = bpCorrect( reflectVec );');

const f3=v=>v.toFixed(3),ROOM_AO=`float crAO(float d){return 1.-.42*exp(-max(d,0.)/.2);}
float roomAO(vec3 p,vec3 n){vec3 a=abs(n);float o=1.;
 if(a.x<.5){o*=crAO(p.x);if(p.x<${f3(W+.001)})o*=crAO(${f3(W)}-p.x);if(p.z<0.)o*=crAO(p.x-${f3(UX)});}

 if(a.z<.5){o*=crAO(${f3(D)}-p.z);o*=crAO(p.x<${f3(UX)}?p.z:p.z+${f3(-UZ)});}

`;

/* ---------- materials ---------- */
const floorM=patch(new THREE.MeshPhysicalMaterial({map:tx('herringbone_parquet_diff_2k.jpg',3.4,1),normalMap:tx('herringbone_parquet_nor_gl_2k.jpg',3.4),roughnessMap:tx('herringbone_parquet_rough_2k.jpg',3.4),roughness:1.35,specularIntensity:.35,normalScale:new THREE.Vector2(.6,.6),clearcoat:.22,clearcoatRoughness:.1}),true,true);
const plasterN=tx('plastered_wall_nor_gl_1k.jpg',2.2);
const wallM=patch(new THREE.MeshStandardMaterial({color:0xefebe4,roughness:.93,normalMap:plasterN,normalScale:new THREE.Vector2(.12,.12)}),false,true);
const ceilM=patch(new THREE.MeshStandardMaterial({color:0xf6f6f5,roughness:.96,normalMap:plasterN,normalScale:new THREE.Vector2(.08,.08)}),false,true);
/* walls block the sun with both faces, so no light slips through corner seams */
wallM.shadowSide=ceilM.shadowSide=THREE.DoubleSide;
const trimM=patch(new THREE.MeshStandardMaterial({color:0xf3f1ec,roughness:.42}),true,true);
const steelM=boxProject(new THREE.MeshStandardMaterial({color:0x161616,roughness:.42,metalness:.55}));
const sillM=boxProject(new THREE.MeshStandardMaterial({color:0xe7e3dc,roughness:.3}));
const doorM=boxProject(new THREE.MeshStandardMaterial({color:0x3a2a1f,roughness:.48}));
const brassM=boxProject(new THREE.MeshStandardMaterial({color:0xc8a45c,roughness:.28,metalness:1}));
const glassM=boxProject(new THREE.MeshStandardMaterial({color:0,roughness:.03,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
const lensM=new THREE.MeshBasicMaterial({color:new THREE.Color(1,.93,.82).multiplyScalar(6)});

/* soft contact shadows under furniture and behind frames */
const blobT=(()=>{const n=128,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),d=x.createImageData(n,n);
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){const u=Math.abs(i/(n-1)*2-1),v=Math.abs(j/(n-1)*2-1),k=.45,q=Math.hypot(Math.max(u-k,0),Math.max(v-k,0))/(1-k),a=Math.pow(Math.max(0,1-q),2.4),o=(j*n+i)*4;d.data[o]=d.data[o+1]=d.data[o+2]=a*255;d.data[o+3]=255}

const blob=(sx,sz,op)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(sx,sz),new THREE.MeshBasicMaterial({color:0,alphaMap:blobT,transparent:true,opacity:op,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4}));return m};

/* world-space UVs in metres so textures keep a real-world scale on every surface */
function wuv(g){const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));

const box=(x0,x1,y0,y1,z0,z1,m=wallM,cast=true)=>{const b=new THREE.Mesh(wuv(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0).translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2)),m);b.castShadow=cast;b.receiveShadow=true;scene.add(b);return b};

/* ---------- L-shaped floor & ceiling ---------- */
const sh=new THREE.Shape();[[0,0],[UX,0],[UX,-UZ],[W,-UZ],[W,-D],[0,-D]].forEach(([a,b],i)=>i?sh.lineTo(a,b):sh.moveTo(a,b));

/* roof overhanging every wall, so the sun can't sneak through the wall/ceiling seams */
box(-.35,W+.4,H+.02,H+.4,UZ-.35,D+.35,ceilM).receiveShadow=false;

/* ---------- walls, door ---------- */
const DZ0=2.55,DZ1=3.55,DH=2.2;
box(-.2,0,0,H,-.2,DZ0);box(-.2,0,DH,H,DZ0,DZ1);box(-.2,0,0,H,DZ1,D+.2);
box(-.2,UX,0,H,-.2,0);box(UX-.2,UX,0,H,UZ-.2,0);box(UX-.2,W+.3,0,H,UZ-.2,UZ);box(-.2,W+.3,0,H,D,D+.2);
box(-.13,-.08,0,DH,DZ0,DZ1,doorM);[[.2,1.0],[1.2,2.0]].forEach(([a,b])=>box(-.08,-.07,a,b,DZ0+.13,DZ1-.13,doorM));
box(0,.022,0,DH+.08,DZ0-.08,DZ0,trimM);box(0,.022,0,DH+.08,DZ1,DZ1+.08,trimM);box(0,.022,DH,DH+.08,DZ0-.08,DZ1+.08,trimM);
box(-.08,-.06,1.02,1.05,DZ1-.14,DZ1-.1,brassM);box(-.06,-.02,1.025,1.045,DZ1-.26,DZ1-.1,brassM);

const sk=.1,st=.016;box(0,UX,0,sk,0,st,trimM);box(UX,UX+st,0,sk,UZ,0,trimM);box(UX,W,0,sk,UZ,UZ+st,trimM);box(0,W,0,sk,D-st,D,trimM);

/* ---------- steel-framed window wall ---------- */
const bays=[];{let z=UZ;const p=.46,bw=2.3;box(W,W+.3,0,SILL,UZ-.2,D+.2);box(W,W+.3,HEAD,H,UZ-.2,D+.2);
for(let i=0;i<5;i++){box(W,W+.3,SILL,HEAD,i?z:UZ-.2,i==4?D+.2:z+p);z+=p;if(i<4){bays.push([z,z+bw]);z+=bw}}}

 for(let k=1;k<3;k++){const zc=z0+bw*k/3;bar(SILL,HEAD,zc-.016,zc+.016)}
 for(let k=1;k<3;k++){const yc=SILL+(HEAD-SILL)*k/3;bar(yc-.016,yc+.016,z0,z1)}
 box(W-.05,GX-.03,SILL-.035,SILL,z0,z1,sillM);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(bw,HEAD-SILL),glassM);g.rotation.y=-Math.PI/2;g.position.set(GX-.035,(SILL+HEAD)/2,(z0+z1)/2);scene.add(g);
 });
/* faint cool sky fill (diffuse only, so it never shows up as a fake reflection) */
scene.add(new THREE.HemisphereLight(0xe9eef6,0xd2c8bd,.34));

/* ---------- sun ---------- */
const SUN_EL=.56,SUN_AZ=-.38,SUN=new THREE.Vector3(Math.cos(SUN_EL)*Math.cos(SUN_AZ),Math.sin(SUN_EL),Math.cos(SUN_EL)*Math.sin(SUN_AZ));

/* ---------- outdoors: real HDRI, projected onto a ground plane so it has parallax ---------- */
pending.push(HL.loadAsync('assets/hdri/symmetrical_garden_02_2k.hdr').then(t=>{
 const {data,width:iw,height:ih}=t.image;let best=-1,bu=0;
 for(let y=0;y<ih/2;y+=2)for(let x=0;x<iw;x+=2){const v=THREE.DataUtils.fromHalfFloat(data[(y*iw+x)*4+1]);if(v>best){best=v;bu=(x+.5)/iw}}
 const psiL=Math.atan2(-Math.sin(2*Math.PI*bu),-Math.cos(2*Math.PI*bu));
 const sky=new GroundedSkybox(t,3,180);sky.position.set(W+4,3-.45,(UZ+D)/2);sky.rotation.y=psiL-SUN_AZ;sky.material.color.setScalar(1.5);scene.add(sky);
 /* outdoor objects are lit by the real sky, not the room */
 t.mapping=THREE.EquirectangularReflectionMapping;const env=pmrem.fromEquirectangular(t).texture;paveM.envMap=env}));
/* stone terrace just outside the glass, so the nearest ground has real depth */
const paveM=new THREE.MeshStandardMaterial({map:tx('concrete_pavers_diff_1k.jpg',1.92,1),normalMap:tx('concrete_pavers_nor_gl_1k.jpg',1.92),roughnessMap:tx('concrete_pavers_rough_1k.jpg',1.92),color:0xd8d2c8});
